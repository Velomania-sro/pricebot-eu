      - "https://www.kupkolo.cz/vyhledavani/?q={q}"
      - "https://www.kupkolo.cz/vyhledavani?string={q}"
      - "https://www.kupkolo.cz/?s={q}"
    accept_language: "cs-CZ,cs;q=0.9,en;q=0.8"
    verified: false
    notes: "Jede přes sitemapu (21k URL, ověřeno)."
    product_url_pattern: 'kupkolo\.cz/[^?#]+_z\d+/'

  - id: cyclology
    name: cyclology.cz
    country: CZ
    currency: CZK
    vat: 0.21
    search_url:                # zkouší se shora dolů; probe --fix uloží tu funkční
      - "https://www.cyclology.cz/vyhledavani/?string={q}"
      - "https://www.cyclology.cz/vyhledavani?q={q}"
      - "https://www.cyclology.cz/?s={q}"
    accept_language: "cs-CZ,cs;q=0.9,en;q=0.8"
    verified: false
    enabled: false
    notes: "Probe 2026-09-19: na doméně není e-shop. Každá URL (/, /robots.txt, vyhledávání i sitemap.xml.gz) vrací HTTP 200 se stejnou 0,5kB stránkou 'Verifying your browser, please wait…', která JS/meta-refresh přesměruje na affiliate odkaz prf.hn/click/camref:… (Partnerize). Žádné produkty, JSON-LD ani sitemapa. Ověř správnou doménu shopu; do té doby vypnuto."

  - id: mtbiker
    name: mtbiker.cz
    country: CZ
    currency: CZK
    vat: 0.21
    search_url: "https://www.mtbiker.cz/search?q={q}"
    product_url_pattern: 'mtbiker\.cz/shop/.+-p\d+\.html'
    accept_language: "cs-CZ,cs;q=0.9,en;q=0.8"
    verified: false
    notes: "Jede přes sitemapu (robots.txt ji výslovně povoluje, bere jen sitemap-shop-*). Vyhledávání /search míchá shop, bazar a články a na produkty odkazuje jen přes /ajax.php?f=searchClick, který robots.txt zakazuje – proto product_url_pattern pouští jen přímé /shop/…-pNNN.html a bazar se nikdy nebere."

  # UK shopy (Merlin, Cyclestore, Sigma) záměrně vynechány: clo + dovozní DPH.
