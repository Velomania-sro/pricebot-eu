name: price-monitor

on:
  schedule:
    - cron: "0 4 * * *"        # denně 06:00 Praha (CEST) / 05:00 (CET) – UTC cron
  workflow_dispatch:
    inputs:
      shops:
        description: "Jen tyto shopy (id oddělená čárkou, prázdné = všechny)"
        required: false
        default: ""
      verbose:
        description: "Podrobný log"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Playwright (jen pokud ho některý shop používá)
        run: |
          if python -c "import sys; from pricebot.config import load_shops; sys.exit(0 if any(s.enabled and s.fetcher == 'playwright' for s in load_shops()) else 1)"; then
            python -m playwright install --with-deps chromium
          fi

      # Nákupní ceny dodavatele nesmí do veřejného repa: soubor žije jen v secretu DODAVATEL_CSV
      # (celý obsah dodavatel.csv). Bez secretu běh pokračuje, jen bez srovnání s dodavatelem.
      - name: Ceník dodavatele ze secretu
        env:
          DODAVATEL_CSV: ${{ secrets.DODAVATEL_CSV }}
        run: |
          if [ -n "$DODAVATEL_CSV" ]; then
            printf '%s\n' "$DODAVATEL_CSV" > dodavatel.csv
            echo "dodavatel.csv: $(($(wc -l < dodavatel.csv) - 1)) řádků"
          else
            echo "Secret DODAVATEL_CSV není nastaven – běh bez cen dodavatele."
          fi

      - name: Run pricebot
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # volitelné
          PRICEBOT_PROXY: ${{ secrets.PRICEBOT_PROXY }}         # volitelné
        run: |
          ARGS=""
          if [ -n "${{ inputs.shops }}" ]; then ARGS="$ARGS --shops ${{ inputs.shops }}"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m pricebot run $ARGS

      # matrix/minimum/nad-prahem nesou ceny dodavatele -> jsou v .gitignore a nejdou ani do artefaktu
      # (artefakty veřejného repa si stáhne kdokoli přihlášený). K vidění jsou jen v Google Sheetu.
      - name: Commit data (historie, cache URL)
        run: |
          git config user.name "pricebot"
          git config user.email "pricebot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "prices $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push || echo "push se nepovedl, data jsou v artefaktu"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricebot-${{ github.run_number }}
          path: |
            data/changes.csv
            data/changes.md
          retention-days: 30
